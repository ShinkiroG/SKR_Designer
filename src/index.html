<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com">
  <title>SKR Designer</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="workspaces/skill-tree/skill-tree.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><img src="icon.svg" alt="" width="20" height="20"> SKR Designer</div>
    <nav class="menu">
      <div class="dropdown">
        <button id="btnNew" title="Novo documento (Ctrl+N)">Novo ▾</button>
        <div class="dropdown-menu" id="newMenu" hidden></div>
      </div>
      <button id="btnOpen" title="Abrir arquivo (Ctrl+O)">Abrir</button>
      <button id="btnSave" title="Salvar (Ctrl+S)">Salvar</button>
      <button id="btnSaveAs" title="Salvar como (Ctrl+Shift+S)">Salvar como</button>
    </nav>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>
  <main class="host" id="host"></main>

  <footer class="statusbar">
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="btnUpdates" class="link-button">Verificar atualizações</button>
    <span id="version" class="muted"></span>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="platform.js"></script>
  <script src="shell.js"></script>
  <script src="workspaces/skill-tree/skill-tree.js"></script>
  <script src="boot.js"></script>
</body>
</html>
